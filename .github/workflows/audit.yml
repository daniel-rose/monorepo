name: Audit
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Dependabot's dependency graph cannot read pnpm 12 lockfiles yet
# (dependabot/dependabot-core#15904), so GitHub raises no security alerts.
# This catches advisories published after a change was merged.
jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      # Reads pnpm-lock.yaml only, no install needed
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
