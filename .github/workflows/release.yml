name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          # No registry-url: it sets one shared NPM_CONFIG_USERCONFIG for all
          # packages. semantic-release-pnpm then writes the OIDC token of one
          # package into it and reuses that token for a new package that has
          # to fall back to NPM_TOKEN. Without it, the plugin keeps each
          # package's OIDC token in that package's own .npmrc.

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm --filter "./packages/*" --filter "./configs/*" --filter "./examples/*" --filter "./apps/*" build

      - name: Run linter
        run: pnpm --filter "./packages/*" --filter "./configs/*" --filter "./examples/*" --filter "./apps/*" lint

      - name: Run unit tests
        run: pnpm --filter "./packages/*" --filter "./configs/*" --filter "./examples/*" --filter "./apps/*" test:unit:ci

      - name: Run e2e tests
        run: pnpm --filter "./packages/*" --filter "./examples/*" test:e2e:ci

      # Token fallback for a package without trusted publishing yet. pnpm
      # publish ignores the .npmrc in a package directory, so the token goes
      # into the user .npmrc. ${NPM_TOKEN} stays a placeholder that pnpm
      # resolves at runtime. pnpm still tries OIDC first for every package.
      - name: Configure npm token fallback
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> ~/.npmrc
          fi

      - name: Publish packages (multi-semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # pnpm 12 ignores NPM_CONFIG_*; OIDC publishes get provenance anyway,
          # token publishes only with this.
          PNPM_CONFIG_PROVENANCE: true
        run: pnpm exec multi-semantic-release --ignore-packages='examples/**' --deps.bump=override --deps.prefix='^'