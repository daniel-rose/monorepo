name: ccprofile-diag
on:
  pull_request:
    paths:
      - ".github/diag/**"
      - ".github/workflows/ccprofile-diag.yml"

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - run: node .github/diag/ps-startup.mjs
